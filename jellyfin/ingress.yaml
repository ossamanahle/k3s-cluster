apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-ingress
  namespace: jelly
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jelly-service
                port:
                  number: 8096

