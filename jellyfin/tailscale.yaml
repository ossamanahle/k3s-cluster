apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jelly-tailscale
  namespace: jelly
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - jellyfin-ha
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jelly-service
            port:
              number: 8096
