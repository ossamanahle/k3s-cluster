apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: nextcloud:31-apache
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: nextcloud-config
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/nextcloud/POSTGRES_PASSWORD
            - name: NEXTCLOUD_ADMIN_USER_FILE
              value: /run/secrets/nextcloud/NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD_FILE
              value: /run/secrets/nextcloud/NEXTCLOUD_ADMIN_PASSWORD
          volumeMounts:
            - name: app
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/nextcloud-data
            - name: secrets
              mountPath: /run/secrets/nextcloud
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: nextcloud-app
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
        - name: secrets
          secret:
            secretName: nextcloud-secret
            defaultMode: 0400

---

apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: http

