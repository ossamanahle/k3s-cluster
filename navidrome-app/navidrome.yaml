apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome-app
spec:
  replicas: 1
  selector:
  template:
    spec:
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-nfs
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-nfs-data
      containers:
        - name: navidrome-app
          image: deluan/navidrome:latest
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
          ports:
            - containerPort: 4533
