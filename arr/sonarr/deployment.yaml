apiVersion: apps/v1
kind: Deployment
metadata: 
  name: sonarr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      volumes:
        - name: movies-series
          persistentVolumeClaim:
            claimName: series-movies
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          volumeMounts:
            - name: movies-series
              mountPath: /downloads/movies-series
            - name: config
              mountPath: /config
          envFrom:
            - configMapRef:
                name: sonarr-config
          ports:
            - name: web-ui
              containerPort: 8989

---

apiVersion: v1
kind: Service
metadata:
  name: sonarr-service
  namespace: arr
spec:
  selector:
    app: sonarr
  ports:
    - name: web-ui
      port: 8989
