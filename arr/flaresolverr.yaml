apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: arr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - { name: LOG_LEVEL, value: "info" }
            - { name: TZ, value: "Asia/Beirut" }
          ports:
            - containerPort: 8191
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: flaresolverr-service
  namespace: arr
spec:
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
