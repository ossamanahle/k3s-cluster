apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server:v3
        ports:
          - name: immich-server
            containerPort: 2283
        envFrom: 
          - configMapRef:
              name: immich-config
          - secretRef:
              name: immich-secret
        volumeMounts:
          - name: data
            mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-data

--- 

apiVersion: v1
kind: Service
metadata: 
  name: immich
spec: 
  ports:
    - name: immich-port
      port: 2283
      targetPort: immich-server
